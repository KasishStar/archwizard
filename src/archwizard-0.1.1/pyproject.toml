[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "archwizard"
version = "0.1.1"
description = "A simple setup wizard for Arch Linux"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

authors = [
    {name = "Kasish"}
]

[project.scripts]
archwizard = "archwizard.main:main"

[tool.setuptools]
packages = ["archwizard"]
